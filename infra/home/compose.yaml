name: sportfond-home-probe
services:
  api:
    image: python:3.13-slim
    command: ["python", "-B", "/app/health_server.py"]
    user: "65534:65534"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    volumes:
      - ./health_server.py:/app/health_server.py:ro
    ports:
      - "127.0.0.1:18765:8765"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
  tunnel:
    image: cloudflare/cloudflared:latest
    command: ["tunnel", "--no-autoupdate", "--protocol", "http2", "--url", "http://api:8765"]
    user: "65532:65532"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    mem_limit: 192m
    cpus: 0.5
    pids_limit: 64
    depends_on:
      api:
        condition: service_healthy
